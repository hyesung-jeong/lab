<!doctype html>

// ===== 기존 사이트 엔진 (soxl/index.html 그대로 + 종료상태 캡처) =====
function runDongpa(rows, P){
  // 일별등락률을 '전체 연속'으로 미리 계산 (파이썬 pct_change와 동일)
  const drAll=[]; for(let i=0;i<rows.length;i++) drAll.push(i===0?0:(rows[i][1]/rows[i-1][1]-1)*100);
  const byYear={}; const firstIdxOfYear={};
  rows.forEach((r,i)=>{ if(r[6]===1) return; const y=fyOf(r[0]);
    if(!(y in byYear)){ byYear[y]=[]; firstIdxOfYear[y]=i; }
    byYear[y].push({r:r, dr:drAll[i]}); });
  const years=Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  const yearly={};
  const series={};
  const tlog=[];
  years.forEach(y=>{ 
    // 각 연도 첫 거래일의 직전 행(전체 rows 기준) 종가 = 전일종가 (정답 시트 방식)
    let prevYearClose=0;
    const fi=firstIdxOfYear[y];
    if(fi>0) prevYearClose=rows[fi-1][1];
    const r=backtestYear(byYear[y],P,tlog,prevYearClose); yearly[y]={ret:r.ret,mdd:r.mdd,maxRet:r.maxRet,minRet:r.minRet};
    r.series.forEach(d=>{ series[d.ymd]=d.mult; if(!series._cashR)series._cashR={}; series._cashR[d.ymd]=(d.cashR!==undefined?d.cashR:1); if(!series._live)series._live={}; series._live[d.ymd]={cash:(d._cash||0),shares:(d._shares||0),eq:(d._eq||0),total:(d._total||0)}; }); });
  return {yearly, years, series, tlog};
}
function backtestYear(items,P,tlog,prevYearClose){
  const fee=P.fee||0;  // 매매수수료 (매수·매도 각각)
  const n=items.length;
  const closes=items.map(o=>o.r[1]);
  const dmodes=items.map(o=>o.r[5]); // 동파모드 1공세/0안전
  const drets=items.map(o=>o.dr);   // 전체연속 일별등락률
  let investBase=P.initCap, cash=P.initCap, posSize=investBase/P.nPos;
  let periodPnl=0, peak=P.initCap, maxDD=0; let minTotal=P.initCap;
  const positions={}; // tier -> {bp,sh,bd,inv,bm}
  let prevClose=prevYearClose||0;
  const series=[];
  for(let day=0;day<n;day++){
    const price=closes[day], dret=drets[day], mode=dmodes[day], dayNum=day+1;
    if(dayNum>10 && (dayNum-1)%P.cycle===0){ investBase+=periodPnl; posSize=investBase/P.nPos; periodPnl=0; }
    if(day===0 && !prevYearClose) prevClose=price;
    const posBeforeSell=Object.keys(positions).length;
    let soldToday=false; const toRemove=[];
    // ★시가+종가 이중매도: dblSell ON이면 시가에서 먼저 익절/보유한계 판정, 안되면 종가 판정
    const _openp=(P.dblSell && typeof OPENS!=='undefined')? (function(){ var ii=dateIdxMap?dateIdxMap[items[day].r[0]]:-1; return (ii!=null&&ii>=0&&OPENS[ii]!=null)?OPENS[ii]:price; })() : price;
    function _trySell(atPrice, isOpen){
      for(const t in positions){ if(toRemove.indexOf(t)>=0) continue; const p=positions[t];
        const holdDays=dayNum-p.bd; const profitPct=(atPrice-p.bp)/p.bp*100;
        let shouldSell=false;
        if(p.bm===0) shouldSell=(profitPct>=P.safeProfit)||(holdDays>=P.safeHold);
        else shouldSell=(profitPct>=P.aggProfit)||(holdDays>=P.aggHold);
        if(shouldSell){ const sellAmt=p.sh*atPrice*(1-fee); const pnl=sellAmt-p.inv;
          cash+=sellAmt; periodPnl+=pnl; soldToday=true; toRemove.push(t);
          tlog.push({ymd:items[day].r[0],act:'매도',tier:'T'+t,mode:(p.bm===0?'안전':'공세'),reason:(profitPct>=(p.bm===0?P.safeProfit:P.aggProfit)?'익절':'보유한계')+(isOpen?'(시가)':''),qty:p.sh,price:atPrice,amt:sellAmt}); }
      }
    }
    if(P.dblSell) _trySell(_openp, true);   // ① 시가 판정
    _trySell(price, false);                  // ② 종가 판정
    toRemove.forEach(t=>delete positions[t]);
    if(!(posBeforeSell===P.nPos && soldToday)){
      const canBuy=Object.keys(positions).length<P.nPos && cash>0;
      if(canBuy){ let buyOk=false;
        if(mode===0 && dret<P.safeBuy) buyOk=true;
        else if(mode===1 && dret<P.aggBuy) buyOk=true;
        if(buyOk){ let availTier=-1;
          for(let t=1;t<=P.nPos;t++){ if(!(t in positions)){availTier=t;break;} }
          if(availTier>0){ let maxBuyPrice;
            if(day===0 && !prevYearClose) maxBuyPrice=price;
            else maxBuyPrice=prevClose*(1.0+(mode===0?P.safeBuy:P.aggBuy)/100.0);
            let curInv=0; for(const t in positions) curInv+=positions[t].inv;
            const remBudget=investBase-curInv;
            // 티어 비중(P.tierW)이 있으면 그 비중만큼, 없으면 균등(posSize)
            const tierBudget=(P.tierW&&P.tierW[availTier-1]!=null)?investBase*(P.tierW[availTier-1]/100):posSize;
            const buyAmount=remBudget<tierBudget?remBudget:tierBudget;
            const shares=Math.floor(buyAmount/maxBuyPrice);
            if(shares>0){ const actualInv=shares*price; const buyCost=actualInv*(1+fee);
              if(cash>=buyCost && buyCost<=buyAmount){
                positions[availTier]={bp:price,sh:shares,bd:dayNum,inv:actualInv,bm:mode};
                tlog.push({ymd:items[day].r[0],act:'매수',tier:'T'+availTier,mode:(mode===0?'안전':'공세'),reason:'매수',qty:shares,price:price,amt:actualInv});
                cash-=buyCost; } } } }
      }
    }
    let holdVal=0; for(const t in positions) holdVal+=positions[t].sh*price;
    const total=cash+holdVal;
    if(total>peak) peak=total;
    if(total<minTotal) minTotal=total;
    if(peak>0){ const dd=(peak-total)/peak*100; if(dd>maxDD) maxDD=dd; }
    series.push({ymd:items[day].r[0], mult:total/P.initCap, cashR:(total>0?cash/total:1), _cash:cash, _shares:(function(){let s=0;for(const t in positions)s+=(positions[t].sh||0);return s;})(), _eq:holdVal, _total:total});
    prevClose=price;
  }
  if(P._cap) P._cap.dp={positions:JSON.parse(JSON.stringify(positions)),cash,investBase,posSize,periodPnl,n,lastClose:closes[n-1],lastYmd:items[n-1].r[0]};
  // 마지막 청산
  const finalPrice=closes[n-1];
  for(const t in positions){ cash+=positions[t].sh*finalPrice; }
  const ret=(cash/P.initCap-1)*100;
  const maxRet=(peak/P.initCap-1)*100;  // 연중 최고 수익률
  const minRet=(minTotal/P.initCap-1)*100;  // 연중 최저 수익률
  return {ret:ret, mdd:-maxDD, maxRet:maxRet, minRet:minRet, series:series};
}

function arr(n,v){return new Array(n).fill(v);}
function parseW(s,n){ if(!s||!s.trim()) return arr(n,1);
  const p=s.replace(/,/g,'/').split('/').map(x=>parseFloat(x)).filter(x=>!isNaN(x));
  if(p.length>=n) return p.slice(0,n); return arr(n,1); }
function aggregate(daily, initCap){
  const byYear={};
  daily.forEach(d=>{ (byYear[d.year]=byYear[d.year]||[]).push(d); });
  const years=Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  const yearly={};
  const series={}; // ymd -> 연초대비 배수 (연도별 단리 기준)
  years.forEach(y=>{ const a=byYear[y]; const end=a[a.length-1].asset;
    const ret=(end/initCap-1)*100; let peak=initCap,mdd=0,minAsset=initCap;
